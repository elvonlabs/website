<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Rounder, friendlier — 10px to full pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 24px; display:flex; gap: 20px; align-items:center; }
  .col { display:flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 78px; height: 58px; background: var(--white); border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); }
  .pill { width: 110px; height: 42px; background: var(--indigo-600); border-radius: var(--radius-pill); display:flex; align-items:center; justify-content:center; color:#fff; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius: var(--radius-sm);"></div><span class="lbl">sm · 10</span></div>
  <div class="col"><div class="box" style="border-radius: var(--radius-md);"></div><span class="lbl">md · 16</span></div>
  <div class="col"><div class="box" style="border-radius: var(--radius-lg);"></div><span class="lbl">lg · 24</span></div>
  <div class="col"><div class="box" style="border-radius: var(--radius-xl);"></div><span class="lbl">xl · 32</span></div>
  <div class="col"><div class="pill">pill</div><span class="lbl">pill</span></div>
</body>
</html>
