<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display:flex; }
  .a { flex: 1; display:flex; align-items:center; justify-content:center; gap: 11px; padding: 24px; background: var(--surface-canvas); }
  .b { flex: 1; display:flex; align-items:center; justify-content:center; gap: 11px; padding: 24px; background: var(--surface-ink); }
  .mark { width: 34px; height: 34px; }
  .word { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; font-size: 27px; }
</style>
</head>
<body>
  <div class="a">
    <img class="mark" src="../assets/logo/elvon-mark.svg" alt="">
    <span class="word" style="color: var(--ink-900);">Elvon Labs</span>
  </div>
  <div class="b">
    <img class="mark" src="../assets/logo/elvon-mark.svg" alt="">
    <span class="word" style="color: var(--text-on-ink);">Elvon Labs</span>
  </div>
</body>
</html>
