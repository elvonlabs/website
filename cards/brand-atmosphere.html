<!-- @dsCard group="Brand" viewport="700x180" name="Atmosphere" subtitle="Warm pastel glow over the cream canvas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); height: 180px; position: relative; overflow: hidden; }
  .blob { position:absolute; width: 240px; height: 240px; border-radius: 9999px; filter: blur(60px); }
  .b1 { background: var(--glow-indigo); top: -70px; left: 8%; }
  .b2 { background: var(--glow-coral); bottom: -90px; left: 38%; }
  .b3 { background: var(--glow-sun); top: -50px; right: 6%; }
  .cap { position: absolute; left: 24px; bottom: 18px; color: var(--text-muted); font-size: 13px; z-index: 2; }
  .cap b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="cap"><b>Warm glow.</b> Indigo, coral &amp; sun radial blurs, soft and low — used sparingly behind heroes.</div>
</body>
</html>
