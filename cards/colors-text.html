<!-- @dsCard group="Colors" viewport="700x160" name="Text on Paper" subtitle="The warm ink ramp over the cream canvas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 22px; display:flex; flex-direction:column; gap: 9px; }
  .line { display:flex; align-items: baseline; gap: 14px; }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); width: 110px; }
  .sample { font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
  <div class="line"><span class="lbl">--text-strong</span><span class="sample" style="color: var(--text-strong);">Learn to do real research</span></div>
  <div class="line"><span class="lbl">--text-body</span><span class="sample" style="color: var(--text-body);">Learn to do real research</span></div>
  <div class="line"><span class="lbl">--text-muted</span><span class="sample" style="color: var(--text-muted);">Learn to do real research</span></div>
  <div class="line"><span class="lbl">--text-accent</span><span class="sample" style="color: var(--text-accent);">Learn to do real research</span></div>
</body>
</html>
