<!-- @dsCard group="Colors" viewport="700x150" name="Pastel Bands" subtitle="Soft section backgrounds for rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); height: 78px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .name { font-size: 12px; font-weight: 700; color: var(--ink-900); }
  .val { font-size: 10px; font-family: var(--font-mono); color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--band-lavender);"><span class="name">lavender</span><span class="val">indigo-100</span></div>
    <div class="sw" style="background: var(--band-peach);"><span class="name">peach</span><span class="val">coral-100</span></div>
    <div class="sw" style="background: var(--band-butter);"><span class="name">butter</span><span class="val">sun-100</span></div>
    <div class="sw" style="background: var(--band-mint);"><span class="name">mint</span><span class="val">mint-100</span></div>
  </div>
</body>
</html>
