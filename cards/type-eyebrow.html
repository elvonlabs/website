<!-- @dsCard group="Type" viewport="700x130" name="Eyebrow & Tags" subtitle="Uppercase semibold labels in warm accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 24px; display:flex; align-items:center; gap: 12px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 13px; border-radius: var(--radius-pill); }
  .eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--coral-600); }
</style>
</head>
<body>
  <span class="eyebrow">How it works</span>
  <span class="tag" style="color:var(--indigo-700); background:var(--indigo-100);">AI</span>
  <span class="tag" style="color:var(--coral-600); background:var(--coral-100);">Healthcare</span>
  <span class="tag" style="color:#1c7a60; background:var(--mint-100);">Foundational Computer Science</span>
  <span class="tag" style="color:#9a6a12; background:var(--sun-100);">14 Weeks</span>
</body>
</html>
