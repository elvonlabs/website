<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 22px; display:flex; flex-direction:column; gap: 14px; }
  .hero { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink-900); }
  .heading { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink-900); }
  .meta { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); margin-top: 4px; }
</style>
</head>
<body>
  <div>
    <div class="hero">Learn to do real research</div>
    <div class="meta">Bricolage Grotesque · bold 700 · -0.02em</div>
  </div>
  <div>
    <div class="heading">A researcher who actually publishes</div>
    <div class="meta">section heading · 700</div>
  </div>
</body>
</html>
