<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 20px; display:flex; gap: 10px; justify-content: space-between; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .ic { width: 30px; height: 30px; /* tint indigo-600 */ filter: invert(22%) sepia(72%) saturate(3200%) hue-rotate(245deg) brightness(92%) contrast(95%); }
  .lbl { font-size: 10px; color: var(--text-muted); text-align:center; }
</style>
</head>
<body>
  <div class="col"><img class="ic" src="../assets/icons/ai.svg"><span class="lbl">AI</span></div>
  <div class="col"><img class="ic" src="../assets/icons/healthcare.svg"><span class="lbl">Healthcare</span></div>
  <div class="col"><img class="ic" src="../assets/icons/quantum.svg"><span class="lbl">Quantum</span></div>
  <div class="col"><img class="ic" src="../assets/icons/telecom.svg"><span class="lbl">Telecom</span></div>
  <div class="col"><img class="ic" src="../assets/icons/computer-science.svg"><span class="lbl">CS</span></div>
  <div class="col"><img class="ic" src="../assets/icons/mechanical.svg"><span class="lbl">Robotics</span></div>
  <div class="col"><img class="ic" src="../assets/icons/book.svg"><span class="lbl">Publications</span></div>
</body>
</html>
