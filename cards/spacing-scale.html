<!-- @dsCard group="Spacing" viewport="700x150" name="Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 22px; display:flex; align-items: flex-end; gap: 16px; }
  .col { display:flex; flex-direction: column; align-items: center; gap: 8px; width: 52px; }
  .bar { background: var(--indigo-500); border-radius: 4px; width: 100%; }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height: 8px;"></div><span class="lbl">2 · 8</span></div>
  <div class="col"><div class="bar" style="height: 16px;"></div><span class="lbl">4 · 16</span></div>
  <div class="col"><div class="bar" style="height: 24px;"></div><span class="lbl">6 · 24</span></div>
  <div class="col"><div class="bar" style="height: 32px;"></div><span class="lbl">8 · 32</span></div>
  <div class="col"><div class="bar" style="height: 48px;"></div><span class="lbl">12 · 48</span></div>
  <div class="col"><div class="bar" style="height: 64px;"></div><span class="lbl">16 · 64</span></div>
  <div class="col"><div class="bar" style="height: 96px;"></div><span class="lbl">24 · 96</span></div>
</body>
</html>
