<!-- @dsCard group="Components" viewport="700x340" name="Forms" subtitle="Inputs, select, textarea, checkbox cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Textarea, Select, CheckboxCard } = window.ElvonLabsDesignSystem_d7be89;
  function Demo() {
    const [areas, setAreas] = React.useState(['Artificial Intelligence']);
    const toggle = (a) => setAreas((p) => p.includes(a) ? p.filter(x => x !== a) : [...p, a]);
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div className="grid">
          <Input label="Full name" placeholder="Jane Doe" />
          <Input label="Email" type="email" placeholder="jane@example.com" />
        </div>
        <div className="grid">
          <Select label="Current role" placeholder="Select one" options={['PhD / Graduate student','Industry researcher','Student (undergrad)']} />
          <div>
            <div style={{ fontSize: 14, fontWeight: 500, color: 'var(--text-body)', marginBottom: 8 }}>Areas of interest</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {['Artificial Intelligence','Healthcare'].map(a => (
                <CheckboxCard key={a} label={a} checked={areas.includes(a)} onChange={() => toggle(a)} />
              ))}
            </div>
          </div>
        </div>
        <Textarea label="Anything else?" rows={2} placeholder="Background, papers, projects..." />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
