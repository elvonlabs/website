<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Soft warm-tinted card shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-canvas); padding: 28px; display:flex; gap: 28px; align-items:center; }
  .col { display:flex; flex-direction: column; align-items: center; gap: 14px; }
  .box { width: 110px; height: 72px; background: var(--white); border-radius: var(--radius-md); }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="box-shadow: var(--shadow-sm);"></div><span class="lbl">sm</span></div>
  <div class="col"><div class="box" style="box-shadow: var(--shadow-card);"></div><span class="lbl">card</span></div>
  <div class="col"><div class="box" style="box-shadow: var(--shadow-lg);"></div><span class="lbl">lg (hover)</span></div>
  <div class="col"><div class="box" style="box-shadow: var(--shadow-glow); background: var(--indigo-600);"></div><span class="lbl">glow (CTA)</span></div>
</body>
</html>
